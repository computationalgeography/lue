# A Conda environment which mimics the Conda build environment on osx as much as possible. It can be used to
# test building LUE outside of the Conda build environment (also on non-osx platforms).
#
# Keep versions in sync with those in
# https://github.com/conda-forge/conda-forge-pinning-feedstock/blob/main/recipe/conda_build_config.yaml
#
# conda env create --file=conda_build_environment-osx.yml
# conda activate lue_conda_build-osx

name: lue_conda_build-osx
channels:
  - conda-forge
  - nodefaults
dependencies:
  - clang=21
  - clangxx=21
  - cmake
  - cxxopts
  - docopt-ng
  - hpx
  - jinja2
  - libboost-devel
  - libgdal
  - matplotlib-base
  - ninja
  - nlohmann_json
  - numpy=2
  - pybind11
  - python=3.14
