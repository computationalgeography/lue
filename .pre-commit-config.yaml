# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# NOTE: Fix versions so everybody uses the same versions of all tools. Things become very messy otherwise.
#       It is OK to bump versions, but do it consiously. Run `pre-commit run --all-files` afterwards and
#       commit any updates.
exclude: |
  (?x)^(
    environment/cmake/.*\.patch|
    environment/cmake/UseLATEX\.cmake|
    environment/cmake/conan-.*\.cmake|
    source/framework/algorithm/include/lue/framework/algorithm/definition/FastNoiseLite.h|
    source/view/imgui/include/lue/imgui/font/.*
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # Order matters: fixing code must happen before formatting it
      - id: ruff-check
        args: [--fix]
        # Skip game_of_life.py because a same-named script exists in quick_start ...
        exclude: |
          (?x)^(
            environment/conda/run_test.py|
            environment/script/.*|
            source/data_model/python/test/.*|
            document/luepy/ext/.*|
            document/doc/manual/quality_assurance/scalability/game_of_life.py|
            source/framework/api/python/.*|
            source/framework/case_study/.*|
            source/framework/python/test/.*|
          )$
      - id: ruff-format
        files: |
          (?x)^(
            .*\.py|
            .*\.py.in|
          )$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # args: [--verbose]
        # Skip game_of_life.py because a same-named script exists in quick_start ...
        exclude: |
          (?x)^(
            source/data_model/python/test/.*|
            document/luepy/ext/.*|
            document/documentation/manual/quality_assurance/scalability/game_of_life.py|
            source/framework/case_study/.*|
            source/framework/python/test/.*|
          )$
        additional_dependencies:
          - types-python-dateutil==2.9.0.20261021
          - types-requests==2.33.0.20261006
  # - repo: https://github.com/pycqa/isort
  #   rev: 6.0.1
  #   hooks:
  #       - id: isort
  #         files: |
  #             (?x)^(
  #               .*\.py|
  #               .*\.py.in|
  #             )$
  # TODO REQUIRES RUBY - repo: https://github.com/markdownlint/markdownlint
  # TODO REQUIRES RUBY   rev: v0.12.0
  # TODO REQUIRES RUBY   hooks:
  # TODO REQUIRES RUBY   - id: markdownlint
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [] # Relevant: don't update files, just report
  - repo: https://github.com/cpp-linter/cpp-linter-hooks
    rev: v1.6.1
    hooks:
      # Keep clang-* versions in sync with environment/configuration/requirements-dev.txt
      - id: clang-format
        args: [--version=23.1.3, --dry-run]
      - id: clang-tidy
        args: [--version=23.1.3, --quiet]
        # TODO: Update code and remove excluded directories from this list
        exclude: |
          (?x)^(
            source/data_model/.*/test/.*|
            source/data_model/gdal/include/lue/gdal/library.hpp|
            source/data_model/python/.*|
            source/data_model/validate/.*|
            source/document/c/.*|
            source/framework/algorithm/.*|
            source/framework/api/c/.*|
            source/framework/api/cxx/test/io_test.cpp|
            source/framework/api/cxx/test/unit_test.hpp|
            source/framework/api/python/source/io.cpp|
            source/framework/core/.*|
            source/framework/image_land/.*|
            source/framework/io/.*|
            source/framework/model/.*|
            source/framework/partitioned_array/.*|
            source/framework/partitioned_route/.*|
            source/framework/python/.*|
            source/framework/test/.*|
            source/python/.*|
            source/python/test/.*|
            source/quality_assurance/.*|
            source/view/.*|
          )$
