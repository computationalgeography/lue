[tool.codespell]
skip = "*.cpp,*.cpp.in,*.hpp,*.hpp.in,*.tex,*_test.py,pyproject.toml"
ignore-words-list = "nD"

# https://docs.astral.sh/ruff/configuration/
[tool.ruff.lint]
extend-select = ["I"]
# ignore = []

[tool.ruff.lint.isort]
known-first-party = ["lue_test"]

[tool.typos]
default.extend-ignore-identifiers-re = [
    ".*_FPR_.*",
    "InputElemenT",
    "nd",
    "ND",
    "setp",
]
default.extend-ignore-words-re = ["PN"]
